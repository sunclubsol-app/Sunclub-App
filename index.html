<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sunclub</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 16px;
      background: #f5f5f5;
    }
    h1 {
      margin-top: 0;
    }
    .box {
      background: #ffffff;
      padding: 16px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .ok {
      color: green;
      font-weight: bold;
    }
    .err {
      color: red;
      font-weight: bold;
    }
    pre {
      background: #eee;
      padding: 8px;
      overflow-x: auto;
    }
  </style>
</head>

<body>
  <h1>Sunclub</h1>

  <div class="box">
    <p>Status:</p>
    <div id="status">Laddar…</div>
    <pre id="data"></pre>
  </div>

  <script>
    // ===== BACKEND =====
    const BACKEND_URL = "https://script.google.com/macros/s/AKfycbw07gsBM2iqRcg21U85cvgAKzgb6EriYi580mzqQNKjL2n4KwAlgfJUg05Jt87Jmazo/exec?api=ping";
<!                       https://script.google.com/macros/s/AKfycbwNNStVNbP-GWI4_qhB8qVYEgZdl-W6lGOFSmF7pWFXVcK4EamCdKt-0QdNoUMwMy-R/exec
    -- -->
    const statusEl = document.getElementById("status");
    const dataEl = document.getElementById("data");

    // Enkel test-anrop
    fetch(BACKEND_URL)
      .then(response => {
        if (!response.ok) {
          throw new Error("HTTP " + response.status);
        }
        return response.text();
      })
      .then(text => {
        statusEl.innerHTML = '<span class="ok">Backend svarar ✔</span>';
        dataEl.textContent = text;
      })
      .catch(err => {
        statusEl.innerHTML = '<span class="err">Fel vid anrop ❌</span>';
        dataEl.textContent = err.message;
      });
  </script>
</body>
</html>
